apiVersion: v1
kind: Namespace
metadata:
  name: test-ns
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-app
  namespace: test-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-app
  template:
    metadata:
      annotations:
        ira.aws/trust-anchor-id: "anchor-123"
        ira.aws/profile-arn: "arn:aws:iam::123456789012:profile/my-profile"
        ira.aws/role-arn: "arn:aws:iam::123456789012:role/my-role"
      labels:
        app: test-app
    spec:
      containers:
      - name: main-container
        image: nginx:latest
