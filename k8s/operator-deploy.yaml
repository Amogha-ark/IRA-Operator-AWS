apiVersion: v1
kind: Namespace
metadata:
  name: ira-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ira-operator-sa
  namespace: ira-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ira-operator
  namespace: ira-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ira-operator
  template:
    metadata:
      labels:
        app: ira-operator
    spec:
      serviceAccountName: ira-operator-sa
      containers:
      - name: operator
        image: amogha-ark/ira-operator-aws:latest
        env:
        - name: WATCH_NAMESPACES
          value: "default,test-ns"
        - name: CREDHELPER_IMAGE
          value: "aws-ira/credhelper:latest"
