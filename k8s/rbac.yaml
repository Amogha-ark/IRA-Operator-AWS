apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ira-operator-role
rules:
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets"]
  verbs: ["get", "list", "watch", "patch", "update"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ira-operator-binding
subjects:
- kind: ServiceAccount
  name: ira-operator-sa
  namespace: ira-system
roleRef:
  kind: ClusterRole
  name: ira-operator-role
  apiGroup: rbac.authorization.k8s.io
